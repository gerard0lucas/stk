  <!-- Lightbox -->
  <div id="gallery-lightbox" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/90 p-4" aria-modal="true" role="dialog" aria-label="View image">
    <button type="button" id="lightbox-close" class="absolute top-4 right-4 z-10 w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center text-white transition" aria-label="Close">
      <i class="fa-solid fa-times text-xl"></i>
    </button>
    <img id="lightbox-img" src="" alt="" class="max-w-full max-h-[90vh] w-auto h-auto object-contain rounded-lg shadow-2xl" />
  </div>

  <div id="site-footer"></div>

  <script src="includes/load-header-footer.js"></script>
  <script>
    (function() {
      var lightbox = document.getElementById('gallery-lightbox');
      var lightboxImg = document.getElementById('lightbox-img');
      var lightboxClose = document.getElementById('lightbox-close');
      if (!lightbox || !lightboxImg) return;

      function openLightbox(src, alt) {
        lightboxImg.src = src;
        lightboxImg.alt = alt || '';
        lightbox.classList.remove('hidden');
        lightbox.classList.add('flex');
        document.body.style.overflow = 'hidden';
      }

      function closeLightbox() {
        lightbox.classList.add('hidden');
        lightbox.classList.remove('flex');
        document.body.style.overflow = '';
      }

      document.querySelectorAll('.gallery-item').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var src = this.getAttribute('data-src');
          var alt = this.getAttribute('data-alt');
          if (src) openLightbox(src, alt);
        });
      });

      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', function(e) {
        if (e.target === lightbox) closeLightbox();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeLightbox();
      });
    })();
  </script>
